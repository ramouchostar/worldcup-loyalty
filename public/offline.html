<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors ligne — Boosteats</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0C1509;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      margin: 0;
    }
    .card {
      max-width: 360px;
    }
    .emoji { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 900; margin: 0 0 8px; }
    p { color: #9ca3af; font-size: 15px; line-height: 1.6; margin: 0 0 24px; }
    a {
      display: inline-block;
      background: #6B7C3F;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📶</div>
    <h1>Pas de connexion</h1>
    <p>Tu es hors ligne. Reconnecte-toi pour accéder à Boosteats.</p>
    <a href="/">Réessayer</a>
  </div>
</body>
</html>
